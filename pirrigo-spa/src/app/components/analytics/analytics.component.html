<mat-card>
  <div class="control-buttons">
    <button (click)="loadAllCharts()" mat-fab color="accent" aria-label="Refresh data">
      <mat-icon>refresh</mat-icon>
    </button>
    <mat-form-field appearance="fill" class="days-selector">
      <mat-label>Days</mat-label>
      <input matInput type="number" [(ngModel)]="days" (blur)="loadAllCharts()" min="1" max="365">
    </mat-form-field>
  </div>

  <mat-tab-group>
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">bar_chart</mat-icon>
        Daily Summary
      </ng-template>
      <hr />
      <div #containerRef>
        <ngx-charts-line-chart *ngIf="chartData[5]"
          [view]="[containerRef.offsetWidth, 350]"
          [scheme]="colorScheme" [legend]="true"
          [xAxis]="true" [yAxis]="true"
          [showXAxisLabel]="true" [showYAxisLabel]="true"
          xAxisLabel="Date" yAxisLabel="Minutes"
          [timeline]="true" [results]="chartData[5]">
        </ngx-charts-line-chart>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">bar_chart</mat-icon>
        By Station
      </ng-template>
      <hr />
      <div #containerRef>
        <ngx-charts-bar-vertical *ngIf="chartData[1]"
          [view]="[containerRef.offsetWidth, 350]"
          [scheme]="colorScheme" [legend]="true"
          [xAxis]="true" [yAxis]="true"
          [showXAxisLabel]="true" [showYAxisLabel]="true"
          xAxisLabel="Station" yAxisLabel="Minutes"
          [results]="chartData[1]">
        </ngx-charts-bar-vertical>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">today</mat-icon>
        By Day of Week
      </ng-template>
      <hr />
      <div #containerRef>
        <ngx-charts-bar-vertical *ngIf="chartData[2]"
          [view]="[containerRef.offsetWidth, 350]"
          [scheme]="colorScheme" [legend]="true"
          [xAxis]="true" [yAxis]="true"
          [showXAxisLabel]="true" [showYAxisLabel]="true"
          xAxisLabel="Day" yAxisLabel="Minutes"
          [results]="chartData[2]">
        </ngx-charts-bar-vertical>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">hourglass_bottom</mat-icon>
        By Hour
      </ng-template>
      <hr />
      <div #containerRef>
        <ngx-charts-line-chart *ngIf="chartData[4]"
          [view]="[containerRef.offsetWidth, 350]"
          [scheme]="colorScheme" [legend]="true"
          [xAxis]="true" [yAxis]="true"
          [showXAxisLabel]="true" [showYAxisLabel]="true"
          xAxisLabel="Hour" yAxisLabel="Minutes"
          [timeline]="true" [results]="chartData[4]">
        </ngx-charts-line-chart>
      </div>
    </mat-tab>
  </mat-tab-group>
</mat-card>
